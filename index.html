<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tatiana Roncancio — Edición de video · Catálogo digital</title>
<meta name="description" content="Portafolio de edición de reels y catálogos digitales.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#0A0A12;
  --acento:#8060D0;
  --acento-hover:#6E4FC0;
  --acento-txt:#7060B0;
  --muted:rgba(10,10,18,.7);
  --soft:rgba(10,10,18,.6);
  --borde:rgba(196,181,244,.4);
  --vidrio:rgba(255,255,255,.7);
  --sombra:0 8px 32px rgba(160,140,220,.16);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#fff;color:var(--dark);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

/* Fondo con manchas difuminadas */
.blobs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.85}
.b1{width:360px;height:360px;background:#D8C8FF;top:-90px;right:-110px}
.b2{width:210px;height:210px;background:#F8C8E8;top:60px;right:70px}
.b3{width:210px;height:210px;background:#B8D8F8;top:170px;right:-50px}
.b4{width:280px;height:280px;background:#B8D8F8;bottom:-120px;left:-120px;opacity:.5}

.app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:44px 16px 130px}
.view[hidden]{display:none}

/* Tipografía */
.titulo{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:clamp(60px,12vw,112px);line-height:.9;letter-spacing:-1px;margin:0}
.sub{font-family:'Bebas Neue',sans-serif;font-size:clamp(22px,3.4vw,30px);letter-spacing:5px;color:var(--soft);margin:10px 0 0}
.tagline{font-size:15px;line-height:1.55;color:var(--muted);margin:10px 0 0;max-width:48ch}

/* Filtros */
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 16px}
.chip-btn{min-height:40px;padding:0 18px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.6);color:var(--dark);border:1px solid var(--borde);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:background .2s,color .2s}
.chip-btn:hover{background:rgba(255,255,255,.9)}
.chip-btn[aria-pressed="true"]{background:var(--acento);border-color:var(--acento);color:#fff}

/* Grilla tipo feed */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.tile{position:relative;display:block;width:100%;aspect-ratio:9/16;border:0;padding:0;border-radius:8px;overflow:hidden;cursor:pointer;background:#E8E0FC;text-align:left}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s ease}
.tile:hover img{transform:scale(1.04)}
.tile .sin-portada{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:clamp(16px,3vw,22px);letter-spacing:1px;color:rgba(10,10,18,.75)}
.tile .ico{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:14px;background:rgba(255,255,255,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;place-items:center;color:var(--dark)}
.tile .lbl{position:absolute;left:6px;bottom:6px;max-width:calc(100% - 12px);font-size:11px;font-weight:600;color:var(--dark);background:rgba(255,255,255,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:4px 8px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.estado{grid-column:1/-1;padding:40px 0;text-align:center;color:var(--muted);font-size:14px}

/* Vidrio */
.card{background:var(--vidrio);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--borde);border-radius:20px;box-shadow:var(--sombra);padding:18px}

/* Botones */
.btn{min-height:48px;border-radius:24px;background:var(--acento);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;text-decoration:none;border:0;padding:0 26px;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--acento-hover);color:#fff}
.btn-full{display:flex;width:100%}
.link-suave{display:inline-flex;align-items:center;min-height:36px;font-size:13px;font-weight:500;color:var(--acento-txt)}

/* Planes */
.planes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:24px}
.plan h2{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:30px;letter-spacing:1px;margin:0}
.plan .desc{margin:2px 0 10px;font-size:13px;line-height:1.5;color:var(--muted)}
.fila{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--borde)}
.fila .opcion{font-size:15px;font-weight:600}
.ahorro{display:inline-block;margin-top:4px;font-size:11px;font-weight:600;color:#fff;background:var(--acento);padding:3px 8px;border-radius:10px}
.precio{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.precio b{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:38px;line-height:1}
.precio span{font-size:12px;font-weight:600;color:var(--muted)}
.nota{display:flex;align-items:center;gap:8px;margin:18px 0;font-size:13px;color:var(--muted)}

/* Sobre mí y contacto */
.sobre{display:grid;gap:18px;margin-top:24px}
@media (min-width:720px){.sobre{grid-template-columns:260px 1fr;align-items:start}}
.foto{width:100%;aspect-ratio:4/5;border-radius:20px;object-fit:cover;background:#E8E0FC;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.sobre p{margin:0 0 12px;font-size:15px;line-height:1.65;white-space:pre-line}
.contactos{display:grid;gap:10px;margin-top:24px;max-width:460px}
.contacto{display:flex;align-items:center;gap:14px;min-height:64px;text-decoration:none}
.contacto .circ{width:40px;height:40px;border-radius:20px;background:var(--acento);color:#fff;display:grid;place-items:center;flex-shrink:0}
.contacto small{display:block;font-size:12px;color:var(--muted)}
.contacto strong{font-size:15px;font-weight:600}
.contacto:hover strong{color:var(--acento-txt)}

/* Menú inferior en vidrio */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;width:min(440px,calc(100% - 32px));height:68px;border-radius:34px;background:var(--vidrio);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--borde);box-shadow:var(--sombra);display:flex;justify-content:space-around;align-items:center;padding:0 6px;z-index:20}
.dock a{min-width:72px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:500;border-radius:26px}
.dock a:hover{color:var(--dark)}
.dock a[aria-current="page"]{color:var(--acento);font-weight:600}
.dock .dot{width:30px;height:30px;border-radius:15px;background:var(--acento);color:#fff;display:grid;place-items:center}

/* Visor (modal) */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,10,18,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.modal-box{display:flex;gap:16px;align-items:flex-end}
.media{position:relative;height:min(86vh,800px);aspect-ratio:9/16;border-radius:20px;overflow:hidden;background:#D8C8FF}
.media iframe,.media video,.media img{width:100%;height:100%;border:0;display:block;object-fit:cover}
.media .vacio{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;color:rgba(10,10,18,.6)}
.media .abrir{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.info{width:330px;display:flex;flex-direction:column;gap:10px}
.info .tag{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--acento-txt)}
.info h2{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:32px;line-height:1;letter-spacing:.5px;margin:0}
.info p{margin:0;font-size:14px;line-height:1.55;color:var(--muted);white-space:pre-line}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;font-weight:500;padding:4px 10px;border-radius:12px;border:1px solid var(--borde);background:rgba(255,255,255,.55)}
.redondo{width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--borde);display:grid;place-items:center;color:var(--dark);cursor:pointer;padding:0}
.redondo:hover{background:#fff}
.barra{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:3;pointer-events:none}
.barra > *{pointer-events:auto}
.contador{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;color:#fff;background:rgba(10,10,18,.35);padding:4px 12px;border-radius:14px}
.barra .der{display:flex;gap:8px}
.flechas{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:3}
.solo-movil{display:none}

@media (max-width:720px){
  .app{padding-top:36px}
  .modal{padding:0;background:#000}
  .modal-box{width:100%;height:100%}
  .media{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0}
  .info{position:absolute;left:12px;right:12px;bottom:16px;width:auto;max-height:48vh;overflow:auto;z-index:2}
  .info.oculta{display:none}
  .solo-movil{display:grid}
  .flechas{right:12px;top:38%}
  .barra{top:12px;left:12px;right:12px}
}
@media (min-width:900px){
  .grid{gap:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="blobs" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>

<div class="app">
  <!-- TRABAJOS -->
  <section class="view" id="view-trabajos" aria-labelledby="nombre">

</div>

<!-- MENÚ INFERIOR -->
<nav class="dock" aria-label="Menú principal">
  <a href="#trabajos" data-view="trabajos"><span data-icon="grid"></span>Trabajos</a>
  <a href="#planes" data-view="planes"><span data-icon="tag"></span>Planes</a>
  <a href="#sobre-mi" data-view="sobre-mi"><span data-icon="user"></span>Sobre mí</a>
  <a href="#contacto" data-view="contacto"><span class="dot" data-icon="mail"></span>Contáctame</a>
</nav>

<!-- VISOR -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-titulo" hidden>
  <div class="barra">
    <span class="contador" id="m-contador"></span>
    <div class="der">
      <button class="redondo solo-movil" id="m-info" type="button" aria-label="Mostrar u ocultar detalles" aria-pressed="true"></button>
      <button class="redondo" id="m-cerrar" type="button" aria-label="Cerrar"></button>
    </div>
  </div>
  <div class="modal-box">
    <div class="media" id="m-media"></div>
    <div class="info card" id="m-panel">
      <span class="tag" id="m-tag"></span>
      <h2 id="m-titulo"></h2>
      <p id="m-desc"></p>
      <div class="chips" id="m-chips"></div>
      <a class="btn btn-full" href="#contacto" data-cierra>Escríbeme</a>
      <a class="link-suave" href="#planes" id="m-desde" data-cierra style="align-self:center"></a>
    </div>
  </div>
  <div class="flechas">
    <button class="redondo" id="m-prev" type="button" aria-label="Anterior"></button>
    <button class="redondo" id="m-next" type="button" aria-label="Siguiente"></button>
  </div>
</div>

<script>
/* =========================================================
   CONFIGURACIÓN — edita solo esta parte
   ========================================================= */
const CONFIG = {
  // ID de tu Google Sheet (lo que va entre /d/ y /edit en el link).
  // Déjalo vacío para ver datos de ejemplo.

/* Datos de ejemplo (se usan solo si sheetId está vacío) */

  ['reel','[Marca]','[Nombre del proyecto]'],['reel','[Marca]','[Nombre del proyecto]'],
  ['catalogo','[Marca]','[Nombre del catálogo]'],['reel','[Marca]','[Nombre del proyecto]'],

].map(([tipo,marca,titulo]) => ({tipo, marca, titulo, descripcion:'[Qué hiciste: ritmo del corte, color, subtítulos, sonido]', herramientas:'[Herramienta 1], [Herramienta 2]', link:'', portada:''}));

const DEMO_PLANES = [
  {plan:'Solo edición', descripcion:'Tú me envías el material, yo lo edito.', opcion:'1 reel', precio:'10', ahorro:''},
  {plan:'Solo edición', descripcion:'', opcion:'Paquete de 10 reels', precio:'80', ahorro:'Ahorras 20 USD'},

  {plan:'Catálogo digital', descripcion:'', opcion:'Con fotos editadas', precio:'300', ahorro:''},
  {plan:'Catálogo digital', descripcion:'', opcion:'Edición de 50 productos', precio:'500', ahorro:''}
];

/* =========================================================
   A partir de aquí no necesitas tocar nada
   ========================================================= */
const ICONS = {
  grid:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',

  user:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',

  ig:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg>',

};
const PASTELES = ['#D8C8FF','#B8D8F8','#F8C8E8','#E8E0FC','#CFE3F8','#F5DDEE','#C9BCF5','#DCEBFA','#EFD3E8'];

const $ = (s) => document.querySelector(s);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'svg') e.innerHTML = ICONS[v];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false || kid === '') continue;
    e.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return e;
}

/* ---------- Lectura de Google Sheets ---------- */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  const clave = (k) => k.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim().replace(/\s+/g, '_');
  const cab = (rows.shift() || []).map(clave);
  return rows.map((r) => Object.fromEntries(cab.map((k, i) => [k, (r[i] || '').trim()])));
}
async function leerHoja(nombre){
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(nombre)}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('No se pudo leer la hoja ' + nombre);
  return parseCSV(await r.text());
}

/* ---------- Links de video e imágenes ---------- */
function driveId(url){ const m = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/); return m && m[1]; }
function portadaUrl(url){
  if (!url) return '';
  const id = driveId(url);
  return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1000` : url;
}
function reproductor(url){
  if (!url) return null;
  let m;
  if ((m = url.match(/(?:youtube\.com\/(?:shorts\/|watch\?v=|embed\/)|youtu\.be\/)([\w-]{11})/)))
    return h('iframe', {src:`https://www.youtube-nocookie.com/embed/${m[1]}?autoplay=1&playsinline=1&rel=0`, title:'Video', allow:'autoplay; encrypted-media; picture-in-picture; fullscreen', allowfullscreen:true});
  if ((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/)))
    return h('iframe', {src:`https://player.vimeo.com/video/${m[1]}?autoplay=1`, title:'Video', allow:'autoplay; fullscreen; picture-in-picture', allowfullscreen:true});
  if ((m = url.match(/instagram\.com\/(?:reel|reels|p)\/([\w-]+)/)))
    return h('iframe', {src:`https://www.instagram.com/reel/${m[1]}/embed/`, title:'Video', allowfullscreen:true});
  const id = driveId(url);
  if (id) return h('iframe', {src:`https://drive.google.com/file/d/${id}/preview`, title:'Video', allow:'autoplay; fullscreen', allowfullscreen:true});
  if (/\.(mp4|webm|mov)(\?|$)/i.test(url))
    return h('video', {src:url, controls:true, autoplay:true, playsinline:true});
  return null;
}

/* ---------- Estado ---------- */
let trabajos = [], filtro = 'todos', lista = [], actual = 0, ultimoFoco = null;

function normalizarTrabajo(t, i){
  const tipo = (t.tipo || '').toLowerCase().includes('cat') ? 'catalogo' : 'reel';
  return {
    tipo, marca: t.marca || '', titulo: t.titulo || '', descripcion: t.descripcion || '',
    herramientas: (t.herramientas || '').split(',').map((s) => s.trim()).filter(Boolean),
    link: t.link || '', portada: portadaUrl(t.portada || ''), color: PASTELES[i % PASTELES.length]
  };
}

/* ---------- Render: trabajos ---------- */
function renderFiltros(){
  const tipos = new Set(trabajos.map((t) => t.tipo));
  const cont = $('#filtros'); cont.replaceChildren();
  if (tipos.size < 2) return;
  [['todos','Todos'],['reel','Reels'],['catalogo','Catálogos']].forEach(([id, txt]) => {
    cont.append(h('button', {class:'chip-btn', type:'button', 'aria-pressed': String(filtro === id), onclick: () => { filtro = id; renderFiltros(); renderGrid(); }}, txt));
  });
}
function renderGrid(){
  lista = filtro === 'todos' ? trabajos : trabajos.filter((t) => t.tipo === filtro);
  const grid = $('#grid'); grid.replaceChildren();
  if (!lista.length) { grid.append(h('p', {class:'estado'}, 'Pronto habrá trabajos aquí.')); return; }
  lista.forEach((t, i) => {
    const nombre = t.tipo === 'reel' ? 'reel' : 'catálogo';
    grid.append(h('button', {class:'tile', type:'button', style:`background:${t.color}`, 'aria-label': `Ver ${nombre}: ${t.titulo || t.marca}`, onclick: (e) => abrir(i, e.currentTarget)},
      t.portada ? h('img', {src:t.portada, alt:'', loading:'lazy'}) : h('span', {class:'sin-portada'}, t.titulo || t.marca),
      h('span', {class:'ico', svg: t.tipo === 'reel' ? 'play' : 'book'}),
      t.marca ? h('span', {class:'lbl'}, t.marca) : null
    ));
  });
}

/* ---------- Render: planes ---------- */
function renderPlanes(filas){
  const planes = [];
  filas.forEach((f) => {
    if (!f.plan && !f.opcion) return;
    let p = planes.find((x) => x.nombre === f.plan);
    if (!p) { p = {nombre: f.plan, descripcion: '', filas: []}; planes.push(p); }
    if (f.descripcion && !p.descripcion) p.descripcion = f.descripcion;
    if (f.opcion) p.filas.push(f);
  });
  const cont = $('#planes'); cont.replaceChildren();
  planes.forEach((p) => cont.append(h('section', {class:'card plan'},
    h('h2', null, p.nombre),
    p.descripcion ? h('p', {class:'desc'}, p.descripcion) : null,
    p.filas.map((f) => h('div', {class:'fila'},
      h('div', null, h('div', {class:'opcion'}, f.opcion), f.ahorro ? h('span', {class:'ahorro'}, f.ahorro) : null),
      h('div', {class:'precio'}, h('b', null, f.precio), h('span', null, 'USD'))
    ))
  )));
  const nums = filas.map((f) => parseFloat(String(f.precio).replace(/[^\d.]/g, ''))).filter((n) => !isNaN(n));
  $('#m-desde').textContent = nums.length ? `Desde ${Math.min(...nums)} USD · Ver planes` : 'Ver planes';
  const nota = $('#nota-planes'); nota.replaceChildren();
  if (CONFIG.notaPlanes) nota.append(h('span', {svg:'redo'}), CONFIG.notaPlanes);
}

/* ---------- Render: perfil y contacto ---------- */
function renderPerfil(){
  $('#nombre').textContent = CONFIG.nombre.replace('\n', ' ');
  $('#nombre').innerHTML = CONFIG.nombre.split('\n').map((s) => s.replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))).join('<br>');
  $('#subtitulo').textContent = CONFIG.subtitulo;
  $('#tagline').textContent = CONFIG.tagline;
  $('#foto-wrap').replaceChildren(CONFIG.foto
    ? h('img', {class:'foto', src: portadaUrl(CONFIG.foto), alt: 'Foto de ' + CONFIG.nombre.replace('\n', ' ')})
    : h('div', {class:'foto'}, '[Tu foto]'));
  $('#bio').replaceChildren(h('p', null, CONFIG.sobreMi), h('a', {class:'btn', href:'#contacto'}, 'Escríbeme'));

  const c = $('#contactos'); c.replaceChildren();
  const item = (href, icono, etiqueta, valor) => h('a', {class:'card contacto', href, target: href.startsWith('http') ? '_blank' : null, rel: href.startsWith('http') ? 'noopener' : null},
    h('span', {class:'circ', svg: icono}), h('span', null, h('small', null, etiqueta), h('strong', null, valor)));
  if (CONFIG.email) c.append(item('mailto:' + CONFIG.email, 'mailBig', 'Correo', CONFIG.email));
  if (CONFIG.whatsapp) c.append(item('https://wa.me/' + CONFIG.whatsapp.replace(/\D/g, ''), 'chat', 'WhatsApp', '+' + CONFIG.whatsapp.replace(/\D/g, '')));
  if (CONFIG.instagram) c.append(item('https://instagram.com/' + CONFIG.instagram.replace('@', ''), 'ig', 'Instagram', '@' + CONFIG.instagram.replace('@', '')));
  if (!c.children.length) c.append(h('p', {class:'tagline'}, '[Agrega tu correo, WhatsApp o Instagram en CONFIG]'));
}

/* ---------- Visor ---------- */
function pintarVisor(){
  const t = lista[actual];
  const media = $('#m-media'); media.replaceChildren();
  if (t.tipo === 'reel') {
    const p = reproductor(t.link);
    if (p) media.append(p);
    else media.append(t.portada ? h('img', {src:t.portada, alt:''}) : h('span', {class:'vacio'}, '[Tu reel 9:16]'));
  } else {
    media.append(t.portada ? h('img', {src:t.portada, alt:''}) : h('span', {class:'vacio'}, '[Portada del catálogo]'));
    if (t.link) media.append(h('a', {class:'btn abrir', href:t.link, target:'_blank', rel:'noopener'}, 'Abrir catálogo'));
  }
  media.style.background = t.color;
  $('#m-tag').textContent = (t.tipo === 'reel' ? 'Reel' : 'Catálogo') + (t.marca ? ' · ' + t.marca : '');
  $('#m-titulo').textContent = t.titulo;
  $('#m-desc').textContent = t.descripcion;
  $('#m-chips').replaceChildren(...t.herramientas.map((x) => h('span', null, x)));
  $('#m-contador').textContent = `${String(actual + 1).padStart(2, '0')} / ${String(lista.length).padStart(2, '0')}`;
  const una = lista.length < 2;
  $('#m-prev').hidden = una; $('#m-next').hidden = una;
}
function abrir(i, origen){
  actual = i; ultimoFoco = origen || document.activeElement;
  pintarVisor();
  $('#modal').hidden = false; document.body.classList.add('lock');
  $('#m-cerrar').focus();
}
function cerrar(){
  $('#modal').hidden = true; $('#m-media').replaceChildren(); document.body.classList.remove('lock');
  if (ultimoFoco) ultimoFoco.focus();
}
function mover(d){ actual = (actual + d + lista.length) % lista.length; pintarVisor(); }

/* ---------- Navegación por secciones ---------- */
const VISTAS = ['trabajos','planes','sobre-mi','contacto'];
function mostrar(){
  const v = VISTAS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'trabajos';
  VISTAS.forEach((x) => { $('#view-' + x).hidden = x !== v; });
  document.querySelectorAll('.dock a').forEach((a) => a.toggleAttribute('aria-current', a.dataset.view === v));
  document.querySelectorAll('.dock a[aria-current]').forEach((a) => a.setAttribute('aria-current', 'page'));
  window.scrollTo(0, 0);
}

/* ---------- Inicio ---------- */
document.querySelectorAll('[data-icon]').forEach((s) => { s.innerHTML = ICONS[s.dataset.icon]; });
$('#m-cerrar').innerHTML = ICONS.close; $('#m-prev').innerHTML = ICONS.up; $('#m-next').innerHTML = ICONS.down; $('#m-info').innerHTML = ICONS.info;
$('#m-cerrar').addEventListener('click', cerrar);
$('#m-prev').addEventListener('click', () => mover(-1));
$('#m-next').addEventListener('click', () => mover(1));
$('#m-info').addEventListener('click', (e) => { const o = $('#m-panel').classList.toggle('oculta'); e.currentTarget.setAttribute('aria-pressed', String(!o)); });
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') cerrar(); if (e.target.closest('[data-cierra]')) cerrar(); });
document.addEventListener('keydown', (e) => {
  if ($('#modal').hidden) return;
  if (e.key === 'Escape') cerrar();
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') mover(1);
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') mover(-1);
});
window.addEventListener('hashchange', mostrar);

(async function iniciar(){
  renderPerfil(); mostrar();
  $('#grid').replaceChildren(h('p', {class:'estado'}, 'Cargando trabajos…'));
  let filasTrabajos = DEMO_TRABAJOS, filasPlanes = DEMO_PLANES;
  if (CONFIG.sheetId) {
    try { filasTrabajos = await leerHoja(CONFIG.hojaTrabajos); }
    catch (e) { console.warn(e); filasTrabajos = []; }
    try { filasPlanes = await leerHoja(CONFIG.hojaPlanes); }
    catch (e) { console.warn(e); }
  }
  trabajos = filasTrabajos.filter((t) => t.titulo || t.marca || t.link).map(normalizarTrabajo);
  renderFiltros(); renderGrid(); renderPlanes(filasPlanes);
})();
</script>
</body>
